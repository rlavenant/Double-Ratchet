<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Démonstrateur Double Ratchet - Support Présentation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#090d16',
                            panel: '#111827',
                            card: '#1f293d',
                            border: '#374151',
                            neonGreen: '#00ff88',
                            neonCyan: '#00e5ff',
                            neonPurple: '#a855f7',
                            neonRose: '#ff2a85',
                            neonAmber: '#f59e0b'
                        }
                    },
                    fontFamily: {
                        mono: ['JetBrains Mono', 'monospace'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col justify-between bg-cyber-bg text-slate-100 overflow-x-hidden">

    <!-- HEADER & NAVIGATION MODULES -->
    <header class="border-b border-cyber-border/80 bg-cyber-panel/90 backdrop-blur sticky top-0 z-50 px-4 md:px-6 py-3.5">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-cyber-card rounded-xl border border-cyber-neonGreen/40 glow-green">
                    <svg class="w-5 h-5 text-cyber-neonGreen" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-wider bg-gradient-to-r from-cyber-neonGreen via-cyber-neonCyan to-cyber-neonPurple bg-clip-text text-transparent">
                        DOUBLE RATCHET
                    </h1>
                    <p class="text-[11px] text-slate-400 font-mono">Démonstrateur Cryptographique</p>
                </div>
            </div>

            <!-- Navigation Tabs -->
            <nav class="flex flex-wrap justify-center gap-2 bg-cyber-bg p-1.5 rounded-xl border border-cyber-border">
                <button onclick="setModule(0)" id="mod-tab-0" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all">
                    1. Initialisation X3DH
                </button>
                <button onclick="setModule(1)" id="mod-tab-1" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all">
                    2. Double Ratchet
                </button>
                <button onclick="setModule(2)" id="mod-tab-2" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all">
                    3. Forward Secrecy
                </button>
                <button onclick="setModule(3)" id="mod-tab-3" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all">
                    4. Post-Compromise (PCS)
                </button>
            </nav>

            <div class="hidden lg:flex items-center text-[11px] font-mono text-slate-400 gap-1.5 bg-cyber-panel px-2.5 py-1 rounded-lg border border-cyber-border">
                <span>Clavier:</span>
                <kbd class="px-1.5 py-0.5 bg-cyber-card rounded border border-cyber-border text-cyber-neonCyan">&larr;</kbd>
                <kbd class="px-1.5 py-0.5 bg-cyber-card rounded border border-cyber-border text-cyber-neonCyan">&rarr;</kbd>
            </div>
        </div>
    </header>

    <!-- MAIN DEMO AREA -->
    <main class="flex-grow max-w-5xl w-full mx-auto p-4 md:p-6 flex flex-col justify-between">

        <!-- MECHANICAL RATCHET WHEELS HUD -->
        <div class="bg-cyber-panel border border-cyber-border rounded-2xl p-4 mb-6 flex flex-wrap lg:flex-nowrap items-center justify-between gap-4 shadow-xl">
            
            <!-- Roues & Légendes -->
            <div class="flex flex-wrap sm:flex-nowrap items-center gap-4 sm:gap-6 min-w-0">
                <!-- Roue 1 : Symétrique -->
                <div id="ratchet-box-sym" class="ratchet-box flex items-center space-x-3 flex-shrink-0" style="--ratchet-glow: #00ff8866">
                    <div class="relative w-[56px] h-[54px] sm:w-[68px] sm:h-[66px] flex-shrink-0">
                        <svg id="main-ratchet-wheel" class="w-full h-full" viewBox="8 1 90 88">
                            <g id="ratchet-wheel-group">
                                <g id="ratchet-teeth"></g>
                                <circle cx="45" cy="50" r="13" fill="#090d16" stroke="#00ff88" stroke-width="1.6"/>
                                <line x1="45" y1="50" x2="45" y2="41" stroke="#00ff88" stroke-width="1.6" stroke-linecap="round"/>
                                <circle cx="45" cy="50" r="4.5" fill="#00ff88"/>
                            </g>
                            <polygon id="ratchet-pawl" points="0,0" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.4" stroke-linejoin="round"/>
                            <circle cx="88" cy="10" r="4.2" fill="#090d16" stroke="#f59e0b" stroke-width="1.4"/>
                            <circle cx="88" cy="10" r="1.3" fill="#f59e0b"/>
                        </svg>
                    </div>
                    <div>
                        <div class="text-[11px] sm:text-xs font-bold text-cyber-neonGreen whitespace-nowrap">Ratchet symétrique</div>
                        <div class="text-[9px] sm:text-[10px] font-mono text-slate-400 whitespace-nowrap">Chaîne KDF : CK → MK</div>
                        <div id="ratchet-state-sym" class="text-[9px] sm:text-[10px] font-mono text-cyber-neonGreen mt-0.5 whitespace-nowrap">Au repos</div>
                    </div>
                </div>

                <div class="hidden sm:block w-px h-10 bg-cyber-border flex-shrink-0"></div>

                <!-- Roue 2 : Asymétrique -->
                <div id="ratchet-box-dh" class="ratchet-box flex items-center space-x-3 flex-shrink-0" style="--ratchet-glow: #00e5ff66">
                    <div class="relative w-[56px] h-[54px] sm:w-[68px] sm:h-[66px] flex-shrink-0">
                        <svg id="main-ratchet-wheel-dh" class="w-full h-full" viewBox="8 1 90 88">
                            <g id="ratchet-wheel-group-dh">
                                <g id="ratchet-teeth-dh"></g>
                                <circle cx="45" cy="50" r="13" fill="#090d16" stroke="#00e5ff" stroke-width="1.6"/>
                                <line x1="45" y1="50" x2="45" y2="41" stroke="#00e5ff" stroke-width="1.6" stroke-linecap="round"/>
                                <circle cx="45" cy="50" r="4.5" fill="#00e5ff"/>
                            </g>
                            <polygon id="ratchet-pawl-dh" points="0,0" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.4" stroke-linejoin="round"/>
                            <circle cx="88" cy="10" r="4.2" fill="#090d16" stroke="#f59e0b" stroke-width="1.4"/>
                            <circle cx="88" cy="10" r="1.3" fill="#f59e0b"/>
                        </svg>
                    </div>
                    <div>
                        <div class="text-[11px] sm:text-xs font-bold text-cyber-neonCyan whitespace-nowrap">Ratchet asymétrique</div>
                        <div class="text-[9px] sm:text-[10px] font-mono text-slate-400 whitespace-nowrap">Diffie-Hellman : RK, paires</div>
                        <div id="ratchet-state-dh" class="text-[9px] sm:text-[10px] font-mono text-cyber-neonCyan mt-0.5 whitespace-nowrap">Au repos</div>
                    </div>
                </div>
            </div>

            <!-- Titre complet de l'étape & Compteur -->
            <div class="flex items-center space-x-4 border-t lg:border-t-0 lg:border-l border-cyber-border pt-3 lg:pt-0 lg:pl-4 min-w-0 flex-1 justify-between lg:justify-end">
                <div class="min-w-0 flex-1">
                    <div class="text-[9px] sm:text-[10px] font-mono text-slate-400 uppercase tracking-widest whitespace-nowrap">Mécanisme Cryptographique</div>
                    <div id="ratchet-status-label" class="text-xs sm:text-sm font-bold text-cyber-neonGreen font-mono leading-tight break-words">Ratchet Symétrique KDF</div>
                </div>
                
                <div class="text-right border-l border-cyber-border pl-3 sm:pl-4 flex-shrink-0">
                    <div class="text-[9px] sm:text-[10px] font-mono text-slate-400 uppercase tracking-widest whitespace-nowrap">Étape</div>
                    <div id="step-indicator" class="text-lg sm:text-2xl font-black font-mono text-cyber-neonCyan">1 / 4</div>
                </div>
            </div>

        </div>

        <!-- ISOLATED STEP CONTENT AREA -->
        <div id="presentation-viewport" class="flex-grow flex flex-col justify-center my-2 max-w-full">
            <!-- Dynamic step contents rendered by JavaScript -->
        </div>

    </main>

    <!-- FOOTER STEP CONTROLS -->
    <footer class="border-t border-cyber-border bg-cyber-panel/90 px-4 md:px-6 py-4 sticky bottom-0 z-50">
        <div class="max-w-5xl mx-auto flex items-center justify-between gap-4">
            
            <button onclick="prevStep()" id="btn-prev" class="px-4 sm:px-5 py-2.5 bg-cyber-card hover:bg-slate-700 text-slate-200 border border-cyber-border rounded-xl font-semibold text-xs flex items-center gap-2 transition-all">
                &larr; Précédent
            </button>

            <!-- Slide Dots -->
            <div id="slide-dots" class="flex items-center space-x-1.5 sm:space-x-2">
                <!-- Dots populated dynamically -->
            </div>

            <button onclick="nextStep()" id="btn-next" class="px-5 sm:px-7 py-2.5 bg-gradient-to-r from-cyber-neonCyan to-cyber-neonGreen hover:opacity-90 text-slate-950 font-bold rounded-xl text-xs flex items-center gap-2 shadow-lg transition-all border-glow-green">
                Suivant &rarr;
            </button>

        </div>
    </footer>

    <!-- LOGIC & ANIMATION SCRIPTS -->
    <script src="script.js"></script>
</body>
</html>
