<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Démonstrateur Double Ratchet - Support Présentation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#090d16',
                            panel: '#111827',
                            card: '#1f293d',
                            border: '#374151',
                            neonGreen: '#00ff88',
                            neonCyan: '#00e5ff',
                            neonPurple: '#a855f7',
                            neonRose: '#ff2a85',
                            neonAmber: '#f59e0b'
                        }
                    },
                    fontFamily: {
                        mono: ['JetBrains Mono', 'monospace'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');
        
        body {
            background-color: #090d16;
            color: #f3f4f6;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        .glow-green { filter: drop-shadow(0 0 10px rgba(0, 255, 136, 0.35)); }
        .glow-cyan { filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.35)); }
        .glow-purple { filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.35)); }
        .glow-rose { filter: drop-shadow(0 0 10px rgba(255, 42, 133, 0.35)); }

        .ratchet-transition { transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .pawl-transition { transition: transform 0.12s ease-in-out; }

        .step-container {
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tab-active {
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.25);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-cyber-bg text-slate-100 overflow-x-hidden">

    <!-- HEADER & NAVIGATION MODULES -->
    <header class="border-b border-cyber-border/80 bg-cyber-panel/90 backdrop-blur sticky top-0 z-50 px-6 py-3.5">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-cyber-card rounded-xl border border-cyber-neonGreen/40 glow-green">
                    <svg class="w-5 h-5 text-cyber-neonGreen" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-wider bg-gradient-to-r from-cyber-neonGreen via-cyber-neonCyan to-cyber-neonPurple bg-clip-text text-transparent">
                        DOUBLE RATCHET
                    </h1>
                    <p class="text-[11px] text-slate-400 font-mono">Démonstrateur Cryptographique</p>
                </div>
            </div>

            <!-- Navigation Tabs -->
            <nav class="flex flex-wrap justify-center gap-2 bg-cyber-bg p-1.5 rounded-xl border border-cyber-border">
                <button onclick="setModule(0)" id="mod-tab-0" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all">
                    1. Initialisation X3DH
                </button>
                <button onclick="setModule(1)" id="mod-tab-1" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all">
                    2. Double Ratchet
                </button>
                <button onclick="setModule(2)" id="mod-tab-2" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all">
                    3. Forward Secrecy
                </button>
                <button onclick="setModule(3)" id="mod-tab-3" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all">
                    4. Post-Compromise (PCS)
                </button>
            </nav>

            <div class="hidden lg:flex items-center text-[11px] font-mono text-slate-400 gap-1.5 bg-cyber-panel px-2.5 py-1 rounded-lg border border-cyber-border">
                <span>Clavier:</span>
                <kbd class="px-1.5 py-0.5 bg-cyber-card rounded border border-cyber-border text-cyber-neonCyan">&larr;</kbd>
                <kbd class="px-1.5 py-0.5 bg-cyber-card rounded border border-cyber-border text-cyber-neonCyan">&rarr;</kbd>
            </div>
        </div>
    </header>

    <!-- MAIN DEMO AREA -->
    <main class="flex-grow max-w-5xl w-full mx-auto p-4 md:p-6 flex flex-col justify-between">

        <!-- MECHANICAL RATCHET WHEEL HUD -->
        <div class="bg-cyber-panel border border-cyber-border rounded-2xl p-4 mb-6 flex items-center justify-between shadow-xl">
            <div class="flex items-center space-x-4">
                <div class="relative w-14 h-14 flex-shrink-0">
                    <svg id="main-ratchet-wheel" class="w-full h-full transform transition-transform duration-500" viewBox="0 0 100 100">
                        <g id="ratchet-teeth" fill="#111827" stroke="#00ff88" stroke-width="2.5"></g>
                        <circle cx="50" cy="50" r="14" fill="#090d16" stroke="#00ff88" stroke-width="2.5"/>
                        <circle cx="50" cy="50" r="5" fill="#00ff88"/>
                    </svg>
                    <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 100 100">
                        <path id="ratchet-pawl" d="M 68 28 L 52 38 L 70 42 Z" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5" class="pawl-transition"/>
                    </svg>
                </div>
                <div>
                    <div class="text-[10px] font-mono text-slate-400 uppercase tracking-widest">Mécanisme Cryptographique</div>
                    <div id="ratchet-status-label" class="text-sm font-bold text-cyber-neonGreen font-mono">Ratchet Symétrique KDF</div>
                </div>
            </div>

            <!-- Step counter -->
            <div class="text-right border-l border-cyber-border pl-6">
                <div class="text-[10px] font-mono text-slate-400 uppercase tracking-widest">Étape</div>
                <div id="step-indicator" class="text-2xl font-black font-mono text-cyber-neonCyan">1 / 4</div>
            </div>
        </div>

        <!-- ISOLATED STEP CONTENT AREA -->
        <div id="presentation-viewport" class="flex-grow flex flex-col justify-center my-2">
            <!-- Dynamic step contents rendered by JavaScript -->
        </div>

    </main>

    <!-- FOOTER STEP CONTROLS -->
    <footer class="border-t border-cyber-border bg-cyber-panel/90 px-6 py-4 sticky bottom-0 z-50">
        <div class="max-w-5xl mx-auto flex items-center justify-between gap-4">
            
            <button onclick="prevStep()" id="btn-prev" class="px-5 py-2.5 bg-cyber-card hover:bg-slate-700 text-slate-200 border border-cyber-border rounded-xl font-semibold text-xs flex items-center gap-2 transition-all">
                &larr; Précédent
            </button>

            <!-- Slide Dots -->
            <div id="slide-dots" class="flex items-center space-x-2">
                <!-- Dots populated dynamically -->
            </div>

            <button onclick="nextStep()" id="btn-next" class="px-7 py-2.5 bg-gradient-to-r from-cyber-neonCyan to-cyber-neonGreen hover:opacity-90 text-slate-950 font-bold rounded-xl text-xs flex items-center gap-2 shadow-lg transition-all border-glow-green">
                Suivant &rarr;
            </button>

        </div>
    </footer>

    <!-- LOGIC & ANIMATION SCRIPTS -->

        function resetModule4() {
            modules[3].steps = [pcsChoiceStep];

        function selectPCSScenario(key) {
            modules[3].steps = [pcsChoiceStep, ...pcsScenarios[key].steps];
            currentStepIndex = 1;
            renderCurrentStep();
        }

        /* ================= STATE & RENDER LOGIC ================= */
        let currentModuleIndex = 0;
        let currentStepIndex = 0;
        let wheelRotation = 0;

        function initWheelSVG() {
            const container = document.getElementById('ratchet-teeth');
            if (!container) return;
            let pathD = "";
            const cx = 50, cy = 50, rOuter = 40, rInner = 30, teeth = 12;

            for (let i = 0; i < teeth; i++) {
                const a1 = (i * 360 / teeth) * Math.PI / 180;
                const a2 = ((i + 0.5) * 360 / teeth) * Math.PI / 180;
                const a3 = ((i + 1) * 360 / teeth) * Math.PI / 180;

                const x1 = cx + rOuter * Math.cos(a1);
                const y1 = cy + rOuter * Math.sin(a1);
                const x2 = cx + rInner * Math.cos(a2);
                const y2 = cy + rInner * Math.sin(a2);
                const x3 = cx + rOuter * Math.cos(a3);
                const y3 = cy + rOuter * Math.sin(a3);

                if (i === 0) pathD += `M ${x1} ${y1} `;
                pathD += `L ${x2} ${y2} L ${x3} ${y3} `;
            }
            pathD += "Z";
            container.innerHTML = `<path d="${pathD}" fill="#111827" stroke="#00ff88" stroke-width="2.5"/>`;
        }

        function triggerWheelAnimation() {
            wheelRotation += 30;
            const wheel = document.getElementById('main-ratchet-wheel');
            const pawl = document.getElementById('ratchet-pawl');
            if (wheel) wheel.style.transform = `rotate(${wheelRotation}deg)`;
            if (pawl) {
                pawl.style.transform = "translate(-3px, -3px) rotate(-12deg)";
                setTimeout(() => { pawl.style.transform = "translate(0px, 0px) rotate(0deg)"; }, 120);
            }
        }

        function renderCurrentStep() {
            const mod = modules[currentModuleIndex];
            const step = mod.steps[currentStepIndex];

            // Render view canvas
            const viewport = document.getElementById('presentation-viewport');
            viewport.innerHTML = `
                <div class="mb-4">
                    <h2 class="text-xs font-mono text-cyber-neonCyan uppercase tracking-widest mb-1">${mod.title}</h2>
                </div>
                ${step.render()}
            `;

            // Update HUD
            document.getElementById('ratchet-status-label').innerText = step.ratchetLabel;
            document.getElementById('ratchet-status-label').style.color = step.ratchetColor;
            document.getElementById('step-indicator').innerText = `${currentStepIndex + 1} / ${mod.steps.length}`;

            if (step.spinWheel) {
                triggerWheelAnimation();
            }

            // Update Header Tabs
            for (let i = 0; i < 4; i++) {
                const tab = document.getElementById(`mod-tab-${i}`);
                if (i === currentModuleIndex) {
                    tab.className = "px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all bg-cyber-neonCyan/20 text-cyber-neonCyan border border-cyber-neonCyan/50 tab-active";
                } else {
                    tab.className = "px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white";
                }
            }

            // Update Dots
            const dotsContainer = document.getElementById('slide-dots');
            dotsContainer.innerHTML = mod.steps.map((_, idx) => `
                <span class="w-2 h-2 rounded-full transition-all ${idx === currentStepIndex ? 'bg-cyber-neonCyan w-5 glow-cyan' : 'bg-cyber-border'}"></span>
            `).join('');

            // Button States
            const btnPrev = document.getElementById('btn-prev');
            btnPrev.disabled = (currentModuleIndex === 0 && currentStepIndex === 0);
            btnPrev.style.opacity = (currentModuleIndex === 0 && currentStepIndex === 0) ? '0.4' : '1';
        }

        function setModule(idx) {
            currentModuleIndex = idx;
            currentStepIndex = 0;
            if (idx === 3) resetModule4();
            renderCurrentStep();
        }

        function nextStep() {
            const mod = modules[currentModuleIndex];
            if (currentStepIndex < mod.steps.length - 1) {
                currentStepIndex++;
            } else if (currentModuleIndex < modules.length - 1) {
                currentModuleIndex++;
                currentStepIndex = 0;
                if (currentModuleIndex === 3) resetModule4();
            }
            renderCurrentStep();
        }

        function prevStep() {
            if (currentStepIndex > 0) {
                currentStepIndex--;
            } else if (currentModuleIndex > 0) {
                currentModuleIndex--;
                currentStepIndex = modules[currentModuleIndex].steps.length - 1;
            }
            renderCurrentStep();
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                nextStep();
            } else if (e.key === 'ArrowLeft') {
                prevStep();
            }
        });

        window.onload = () => {
            initWheelSVG();
            renderCurrentStep();
        };
